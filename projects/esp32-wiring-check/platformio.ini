; Wiring check firmware for robot1 (Pocket ESP AI on ESP32-C3 SuperMini).
; Guide: docs/wiring/robot1-wiring-check.md

[env:esp32c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
